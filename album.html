        .album-page-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-lg);
        }

        .album-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
            padding: var(--spacing-lg);
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            border-radius: var(--radius-lg);
            color: var(--color-secondary);
        }

        .album-header h2 {
            font-size: 1.5rem;
            margin-bottom: var(--spacing-xs);
        }

        .album-header p {
            opacity: 0.8;
        }

        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .album-photo-card {
            position: relative;
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
        }

        .album-photo-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .album-photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-cover-frame {
            position: relative;
            height: 205px;
            border-radius: 18px;
            overflow: hidden;
        }
        .album-cover-frame .album-cover { display: block; }
        @media(max-width:768px) { .album-cover-frame { height: 145px; } }

        /* Play Icon Overlay */
        .play-icon-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 2;
        }

        .play-icon-overlay::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 10px 0 10px 16px;
            border-color: transparent transparent transparent white;
            margin-left: 4px;
            /* Optical center */
        }

        /* Checkbox style */
        .select-checkbox {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--color-border);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        .select-mode .album-photo-card .select-checkbox {
            display: flex;
        }

        .album-photo-card.selected .select-checkbox {
            background: var(--color-primary);
            border-color: var(--color-primary-dark);
        }

        .album-photo-card.selected .select-checkbox::after {
            content: '✓';
            color: var(--color-secondary);
            font-weight: bold;
        }

        .album-photo-card.selected {
            outline: 3px solid var(--color-primary);
        }

        .selection-info {

            font-size: 0.9rem;

        /* Video Player in Modal */

    <script>
        // AlbumState updated to be more robust
        const AlbumState = {
            photos: [],
            selectedPhotos: new Set(),
            selectionRevision: 0, selectionSignature: '', downloadBusy: false,
            isSelectMode: false,
            currentModalIndex: 0,
            currentModalPhotoId: null,
            momentId: null
        };

        // Only near-screen grid previews may enter the network. Cover loading is
        // separate, so the first two visible grid photos never wait behind it.
        const AlbumPreviewQueue = {
            jobs: new Map(), active: new Set(), observer: null, scheduled: false, paused: false,
            add(img, photo, isCurrent, onOpen) {
                if (this.jobs.has(img)) return;
                const actor = window.TimehutAccounts?.status();
                const placeholder = document.createElement('span');
                placeholder.className = 'photo-preview-pending';
                placeholder.textContent = '照片載入中…';
                placeholder.setAttribute('aria-hidden', 'true');
                img.parentElement.append(placeholder);
                img.alt = '照片預覽（載入中）';
                img.setAttribute('aria-busy', 'true');
                const job = {img, photo, isCurrent, onOpen, placeholder, owner: actor?.user?.id,
                    generation: actor?.generation, state: 'queued', cleanup: null};
                this.jobs.set(img, job);
                if (!this.observer && typeof IntersectionObserver === 'function')
                    this.observer = new IntersectionObserver(() => this.schedule(), {rootMargin: '200px 0px'});
                this.observer?.observe(img);
                this.schedule();
                return () => this.remove(job);
            },
            remove(job) {
                const loading = job.state === 'active';
                job.state = 'cancelled';
                job.cleanup?.(); job.placeholder.remove();
                if (loading) job.img.removeAttribute('src');
                this.active.delete(job);
                if (this.jobs.get(job.img) === job) this.jobs.delete(job.img);
                this.observer?.unobserve(job.img);
                this.schedule();
            },
            clear() {
                this.paused = true;
                this.observer?.disconnect(); this.observer = null;
                for (const job of [...this.jobs.values()]) this.remove(job);
                this.jobs.clear(); this.active.clear();
                this.paused = false;
                const cover = document.getElementById('albumCover');
                cover?._previewCleanup?.();
                if (cover) { cover._previewCleanup = null; cover._boundPhoto = null; }
            },
            schedule() {
                if (this.scheduled || this.paused) return;
                this.scheduled = true;
                requestAnimationFrame(() => { this.scheduled = false; this.drain(); });
            },
            drain() {
                if (this.paused) return;
                const top = Math.max(0, document.querySelector('.header')?.getBoundingClientRect().bottom || 0);
                const actor = window.TimehutAccounts?.status();
                const valid = job => job.img.isConnected && job.isCurrent() &&
                    actor?.user?.id === job.owner && actor?.generation === job.generation;
                const waiting = [...this.jobs.values()].filter(job => {
                    if (job.state !== 'queued') return false;
                    if (!valid(job)) { this.remove(job); return false; }
                    const box = job.img.getBoundingClientRect();
                    return box.bottom > top - 200 && box.top < innerHeight + 200;
                });
                const visible = job => { const box = job.img.getBoundingClientRect(); return box.bottom > top && box.top < innerHeight; };
                waiting.sort((a, b) => Number(visible(b)) - Number(visible(a)) ||
                    Math.abs(a.img.getBoundingClientRect().top - top) - Math.abs(b.img.getBoundingClientRect().top - top));
                for (const job of waiting) {
                    if (this.active.size >= 2) break;
                    job.state = 'active'; this.active.add(job);
                    job.placeholder.remove(); job.img.loading = 'eager';
                    job.img.fetchPriority = visible(job) ? 'high' : 'auto';
                    job.cleanup = FlickrAPI.bindPhotoPreview(job.img, job.photo, {
                        isCurrent: () => this.jobs.get(job.img) === job && job.state !== 'cancelled' && job.isCurrent(),
                        onOpen: job.onOpen,
                        onSettled: () => {
                            if (job.state === 'active') { job.state = 'done'; this.active.delete(job); this.schedule(); }
                        }
                    });
                }
            }
        };
        window.addEventListener('scroll', () => AlbumPreviewQueue.schedule(), {passive: true});
        window.addEventListener('resize', () => AlbumPreviewQueue.schedule());
        for (const event of ['pagehide', 'timehut-account-changed'])
            window.addEventListener(event, () => AlbumPreviewQueue.clear());
        window.addEventListener('pageshow', event => { if (event.persisted) renderPhotos(); });

        // Initialize on page load
        (window.TimehutPage?.onReady || (fn => document.addEventListener('DOMContentLoaded',fn)))( async () => {
            // Get moment data from URL or sessionStorage
            const urlParams = new URLSearchParams(window.location.search);
            AlbumState.momentId = urlParams.get('id');

            // Try to get photos from sessionStorage
            const storedPhotos = (window.TimehutStorage?.session || sessionStorage).getItem('albumPhotos');
            const storedDate = (window.TimehutStorage?.session || sessionStorage).getItem('albumDate');

            if (storedPhotos && (window.TimehutStorage?.session || sessionStorage).getItem('albumMomentId') === AlbumState.momentId) {
                AlbumState.photos = JSON.parse(storedPhotos);
                document.getElementById('momentDate').textContent = storedDate || '同日照片';
                document.getElementById('momentInfo').textContent = `共 ${AlbumState.photos.length} 張照片`;
                document.getElementById('loadingIndicator').style.display = 'none';
                renderPhotos();
            } else if (AlbumState.momentId) {
                if (AlbumState.momentId.startsWith('moment_')) {
                    const album = urlParams.get('album'), date = urlParams.get('date');
                    if (!CONFIG.CHILDREN.some(child => String(child.albumId) === album) || !/^\d{4}-\d{2}-\d{2}$/.test(date || '')) {
                        document.getElementById('momentInfo').textContent = '請從時間軸重新進入此同日照片';
                        document.getElementById('loadingIndicator').style.display = 'none';
                        return;
                    }
                    try {
                        const requested = urlParams.get('photos');
                        const photoIds = requested === null ? null : requested === '' ? [] : requested.split(',');
                        if (photoIds && (photoIds.length > 200 || photoIds.some(id => !/^[0-9]{1,32}$/.test(id))
                            || new Set(photoIds).size !== photoIds.length)) throw new Error('請從時間軸重新進入此同日照片');
                        const loadedPhotos = await FlickrAPI.getAlbumDayPhotos(album, date, (photos, progress) => {
                            replaceLoadedPhotos(photos);
                            if (photos.length) {
                                renderPhotos();
                                const loading = document.getElementById('loadingIndicator');
                                if (loading) loading.style.display = 'none';
                            }
                            document.getElementById('momentInfo').textContent =
                                `已找到 ${photos.length} 張照片／影片 · 正在讀取 ${progress.completed}／${progress.pages} 頁`;
                        }, photoIds);
                        replaceLoadedPhotos(loadedPhotos);
                        document.getElementById('momentDate').textContent = date;
                        document.getElementById('momentInfo').textContent = `共 ${AlbumState.photos.length} 張照片`;
                        renderPhotos();
                    } catch (error) {
                        const info = document.getElementById('momentInfo');
                        const requested = urlParams.get('photos');
                        const deletion = requested && await window.TimehutDeletionStatus?.inspectAlbum(album, requested.split(','));
                        const completed = new Set((deletion?.items || []).filter(row => row.status === 'complete').map(row => row.photoId));
                        if (completed.size) {
                            const next = new URL(location.href), remaining = requested.split(',').filter(id => !completed.has(id));
                            next.searchParams.set('photos', remaining.join(','));
                            if (remaining.length) { AlbumState.momentId = 'moment_' + remaining[0]; next.searchParams.set('id', AlbumState.momentId); }
                            history.replaceState(null, '', next.pathname + next.search + next.hash);
                            if (remaining.every(id => AlbumState.photos.some(photo => String(photo.id) === id))) { renderPhotos(); return; }
                        }
                        const pending = (deletion?.items || []).filter(row => row.status !== 'complete').length;
                        if (pending > 0) {
                            info.textContent = `目前顯示 ${AlbumState.photos.length} 張，${pending} 項刪除尚未確認。`;
                            const link = document.createElement('a'); link.className = 'btn-secondary';
                            link.href = 'transfer.html#photo-deletions'; link.textContent = '接續確認刪除';
                            info.append(' ', link); return;
                        }
                        info.textContent = AlbumState.photos.length
                            ? `目前顯示 ${AlbumState.photos.length} 張，其他照片尚未讀取完成。`
                            : '同日照片載入失敗，請再試一次。';
                        const retry = document.createElement('button');
                        retry.type = 'button'; retry.className = 'btn-secondary'; retry.textContent = '重新載入';
                        retry.addEventListener('click', () => location.reload(), { once: true });
                        info.append(' ', retry);
                    } finally { const loading = document.getElementById('loadingIndicator'); if (loading) loading.style.display = 'none'; }
                    return;
                }

                // Fetch from API if direct link (real album)
                try {
                    const data = await FlickrAPI.getAlbumPhotos(AlbumState.momentId, 1, 500);
                    AlbumState.photos = data.photos;
                    document.getElementById('momentDate').textContent = '同日照片詳情';
                    document.getElementById('momentInfo').textContent = `共 ${AlbumState.photos.length} 張照片`;
                    document.getElementById('loadingIndicator').style.display = 'none';
                    renderPhotos();
                } catch (error) {
                    console.error('Failed to load deep link album:', error);
                    document.getElementById('momentInfo').textContent = '無法載入同日照片資料';
                    document.getElementById('loadingIndicator').style.display = 'none';
                }
            } else {
                document.getElementById('momentInfo').textContent = '無效的同日照片 ID';
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        });

        function renderPhotos() {
            const first = AlbumState.photos[0];
            const photoCount = AlbumState.photos.filter(photo => photo.media !== 'video').length;
            document.getElementById('momentInfo').textContent = `▧ ${photoCount} 張照片 · ${AlbumState.photos.length - photoCount} 部影片`;
            if (first) {
                const date = photoCalendarDay(first);
                document.getElementById('momentDate').textContent = '▦ ' + new Date(date + 'T12:00:00').toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric',weekday:'short'});
                const index = Math.max(0, CONFIG.CHILDREN.findIndex(child => String(child.albumId) === new URLSearchParams(location.search).get('album')));
                const birthday = (window.TimehutStorage?.local || localStorage).getItem(`timehut_child_${index}_birthdate`) || CONFIG.CHILDREN[index].birthDate;
                const age = calculateAge(birthday, date);
                document.getElementById('momentAge').textContent = '☺ ' + formatAgeString(age.years, age.months, age.days);
                const cover = document.getElementById('albumCover');
                if (cover._boundPhoto !== first) {
                    cover._boundPhoto = first;
                    cover.loading = 'eager'; cover.fetchPriority = 'high';
                    cover._previewCleanup = FlickrAPI.bindPhotoPreview(cover, first, {isCurrent:()=>AlbumState.photos[0]===first,onOpen:()=>openModal(0)});
                }
            }
            const gridEl = document.getElementById('albumGrid');
            // Keep an in-flight or decoded preview alive while later metadata pages arrive.
            // Reconcile by photo identity; a replacement object is rebound to fresh metadata.
            const retained = new Set(AlbumState.photos.map(photo => String(photo.id)));
            for (const card of [...gridEl.children]) {
                if (!retained.has(card.dataset.id)) { card._previewCleanup?.(); card.remove(); }
            }
            const existing = new Map([...gridEl.children].map(card => [card.dataset.id, card]));
            AlbumState.photos.forEach((photo, index) => {
                const id=String(photo.id);
                const activate=event=>{const currentIndex=AlbumState.photos.findIndex(row=>String(row.id)===id);if(currentIndex>=0)handleCardClick(event,currentIndex,id);};
                let card=existing.get(id);
                if (card && card._boundPhoto !== photo) { card._previewCleanup?.(); card.remove(); card=null; }
                if (!card) {
                    card=document.createElement('div');card.className='album-photo-card';card.dataset.id=id;card._boundPhoto=photo;
                    const checkbox=document.createElement('button');checkbox.type='button';checkbox.className='select-checkbox';
                    checkbox.setAttribute('aria-label','選取照片');
                    checkbox.addEventListener('click',event=>{event.stopPropagation();togglePhotoSelection(photo.id);});
                    const image=document.createElement('img');image.alt='照片預覽';image.loading='lazy';image.tabIndex=0;image.setAttribute('role','button');
                    image.addEventListener('click',activate);image.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();activate(event);}});
                    card.append(checkbox,image);
                    if(photo.media==='video'){const badge=document.createElement('div');badge.className='play-icon-overlay';card.append(badge);}
                }
                card.dataset.index=index;card.classList.toggle('selected',AlbumState.selectedPhotos.has(photo.id));
                card.querySelector('.select-checkbox').setAttribute('aria-pressed',String(AlbumState.selectedPhotos.has(photo.id)));
                if(gridEl.children[index]!==card)gridEl.insertBefore(card,gridEl.children[index]||null);
                const image=card.querySelector('img');
                if (!AlbumPreviewQueue.jobs.has(image)) card._previewCleanup=AlbumPreviewQueue.add(image,photo,()=>AlbumState.photos.includes(photo)&&card._boundPhoto===photo,activate);
            });
        }

        function updateSelectionUI() {

        async function addTagsToSelected() {

            const photoIds = Array.from(AlbumState.selectedPhotos);

            try {
                const response = await (window.TimehutAPI?.fetch.bind(window.TimehutAPI) || fetch)(`${CONFIG.UPLOAD_API_URL}/api/photos/tags/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ photoIds, tags })
                });

                const result = await response.json();

                if (response.ok) {
                    const { succeeded, failed } = TimehutResults.confirmed(result, photoIds);
                    AlbumState.photos.forEach(photo => { if (succeeded.includes(String(photo.id))) photo.tags = [photo.tags, tags].filter(Boolean).join(' '); });
                    succeeded.forEach(id => AlbumState.selectedPhotos.delete(id));
                    TimehutResults.invalidateAlbumCache();
                    (window.TimehutStorage?.session || sessionStorage).setItem('albumPhotos', JSON.stringify(AlbumState.photos));
                    renderPhotos(); updateSelectionUI();
                    if (failed.length) {
                        alert(`成功為 ${succeeded.length}/${photoIds.length} 張照片加上標籤；${failed.length} 張尚未完成，已保留選取與標籤供重試`);
                    } else {
                        alert(`成功為 ${succeeded.length}/${photoIds.length} 張照片加上標籤`);
                        closeTagModal(); cancelSelection();
                    }
                } else {
                    alert(`加標籤失敗: ${result.error || result.message || '未知錯誤'}`);
                }

            tagBtn.disabled = false;
            tagBtn.textContent = '確認加標籤';

        function syncMomentSourceUrl() {
            const url = new URL(location.href);
            if (!AlbumState.momentId?.startsWith('moment_') || !url.searchParams.has('date')) return null;
            const album = url.searchParams.get('album');
            if (!CONFIG.CHILDREN.some(child => String(child.albumId) === album)) return null;
            const ids = AlbumState.photos.map(photo => String(photo.id));
            if (ids.some(id => !/^[0-9]{1,32}$/.test(id))) return null;
            if (ids.length <= 200) url.searchParams.set('photos', ids.join(','));
            else url.searchParams.delete('photos');
            if (ids.length) {
                AlbumState.momentId = 'moment_' + ids[0];
                url.searchParams.set('id', AlbumState.momentId);
            }
            history.replaceState(history.state, '', url);
            if (ids.length) return null;
            const timeline = new URL('timeline.html', location.href);
            timeline.searchParams.set('album', album);
            return timeline.href;
        }

        function leaveEmptyMoment(url) {
            const uploading = typeof BackgroundUploader !== 'undefined' && BackgroundUploader.isUploading;
            const working = typeof BackgroundWorker !== 'undefined' && BackgroundWorker.isBusy;
            if (!url || uploading || working) return;
            const album = new URL(url).searchParams.get('album');
            const index = CONFIG.CHILDREN.findIndex(child => String(child.albumId) === album);
            if (index < 0) return;
            try { (window.TimehutStorage?.local || localStorage).setItem('timehut_current_child', String(index)); }
            catch (_) { return; }
            location.replace(url);
        }

        // Batch download selected photos as ZIP
        async function downloadSelected() {
            if(AlbumState.downloadBusy)return;
            const selected=[...AlbumState.selectedPhotos];if(!selected.length)return;
            const selectedPhotos=AlbumState.photos.filter(photo=>AlbumState.selectedPhotos.has(photo.id)).map(photo=>({...photo}));
            const downloadBtn=document.getElementById('downloadSelectedBtn');
            updateSelectionUI();const revision=AlbumState.selectionRevision;
            AlbumState.downloadBusy=true;downloadBtn.disabled=true;
            try {
                if(selectedPhotos.length!==selected.length)throw new Error('選取檔案已變更，請重新選取');
                if(!await TimehutTransfers.confirmDownloads(selectedPhotos))return;
                if(revision!==AlbumState.selectionRevision)throw new Error('選取內容已變更，請重新確認下載');
                downloadBtn.textContent='準備下載…';
                const native = await window.TimehutTransfers?.downloadMany(selectedPhotos);
                if (native) {
                    if(revision===AlbumState.selectionRevision){native.accepted.forEach(id => AlbumState.selectedPhotos.delete(id));updateSelectionUI(); renderPhotos();}
                    alert(`手機系統已接受 ${native.accepted.length} 個下載，${native.failed.length} 個尚未送出；請到傳輸中心確認。`);
                    return;
                }

                const zip = new JSZip();
                let successCount = 0;
                let failCount = 0;
                const acquired = [];

                for (let i = 0; i < selectedPhotos.length; i++) {
                    const photo = selectedPhotos[i];
                    if(revision===AlbumState.selectionRevision)downloadBtn.textContent = `下載中... (${i + 1}/${selectedPhotos.length})`;

                    try {
                        // Use proxy-image if needed or get large size
                        const url = await TimehutTransfers.mediaUrl(photo);

                        // Use backend proxy to avoid CORS if needed
                        // const proxyUrl = `${CONFIG.UPLOAD_API_URL}/api/proxy-image?url=${encodeURIComponent(url)}`;
                        // Using direct fetch for now, mostly works with Flickr
                        const response = await (window.TimehutAPI?.fetch.bind(window.TimehutAPI) || fetch)(url);
                        if (!response.ok) throw new Error('下載失敗');

                        const blob = await response.blob();
                        const urlParts = url.split('/');
                        const filename = photo.media === 'video' ? `${photo.id}.${blob.type.split(';')[0].trim().toLowerCase() === 'video/quicktime' ? 'mov' : 'mp4'}` : `${photo.id}-${urlParts[urlParts.length - 1].split('?')[0] || 'media'}`;

                        zip.file(filename, blob);
                        successCount++;
                        acquired.push(photo.id);
                    } catch (e) {
                        console.error('Error downloading photo:', photo.id, e);
                        failCount++;
                    }
                }

                if (successCount === 0) {
                    alert('所有照片下載失敗，請稍後再試');
                    downloadBtn.disabled = false;
                    downloadBtn.innerHTML = '⬇️ 下載';
                    return;
                }

                if(revision===AlbumState.selectionRevision)downloadBtn.textContent = '打包中...';
                const zipBlob = await zip.generateAsync({ type: 'blob' });

                const downloadUrl = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `照片_${new Date().toISOString().split('T')[0]}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(downloadUrl), 60000);
                const selectionUnchanged=revision===AlbumState.selectionRevision;
                if(selectionUnchanged){
                    acquired.forEach(id => AlbumState.selectedPhotos.delete(id));
                    if (!AlbumState.selectedPhotos.size) cancelSelection();
                    else { renderPhotos(); updateSelectionUI(); }
                }

                const message = failCount > 0
                    ? `已交給瀏覽器 ${successCount} 個檔案的 ZIP，${failCount} 個檔案未能下載。${selectionUnchanged?'失敗項目仍保留供重試。':'選取內容已變更，請重新選取失敗項目後重試。'}`
                    : `已交給瀏覽器 ${successCount} 個檔案的 ZIP；請確認實際下載結果。`;
                alert(message);
            } catch (error) {
                console.error('Batch download error:', error);
                alert('下載失敗: ' + error.message);
            } finally {
                AlbumState.downloadBusy=false;
                downloadBtn.innerHTML = '⬇️ 下載';updateSelectionUI();
            }

        }

        async function deleteSelected() {
            const count = AlbumState.selectedPhotos.size;
            if (count === 0) return;

            const confirmed = await showConfirmModal(
                '確認刪除',
                `確定要背景刪除 ${count} 張照片嗎？\n⚠️ 此操作無法復原！\n手機已保存的檔案仍會保留。`,
                '🗑️ 確認刪除'
            );

            if (!confirmed) return;

            const photoIds = Array.from(AlbumState.selectedPhotos);

            // Hand off to background worker
            if (typeof BackgroundWorker !== 'undefined') {
                const deletion = await BackgroundWorker.startDelete(photoIds);
                if (!deletion.accepted) { alert('目前已有作業進行中，選取已保留'); return; }
                let emptySourceUrl = null;
                if (deletion.succeeded.length) {
                    const deleted = new Set(deletion.succeeded.map(String));
                    deletion.succeeded.forEach(id => AlbumState.selectedPhotos.delete(String(id)));
                    AlbumState.photos = AlbumState.photos.filter(photo => !deleted.has(String(photo.id)));
                    TimehutResults.invalidateAlbumCache();
                    emptySourceUrl = syncMomentSourceUrl();
                    renderPhotos(); updateSelectionUI();
                }
                if (deletion.failed.length) { alert(`已確認刪除 ${deletion.succeeded.length} 張；${deletion.failed.length} 張未完成，僅保留未完成項目供重試`); return; }

                if (AlbumState.selectedPhotos.size === 0) cancelSelection();
                showToast(`已確認刪除 ${deletion.succeeded.length} 張照片`, 'success');
                leaveEmptyMoment(emptySourceUrl);
            } else {
                // Fallback to old blocking method
                console.warn('BackgroundWorker not available, using blocking delete');
                const deleteBtn = document.getElementById('deleteSelectedBtn');
                deleteBtn.disabled = true;
                deleteBtn.textContent = '刪除中...';

                try {
                    const response = await (window.TimehutAPI?.fetch.bind(window.TimehutAPI) || fetch)(`${CONFIG.UPLOAD_API_URL}/api/photos/delete`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ photoIds })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        const receipt = TimehutResults.confirmed(result, photoIds);
                        receipt.succeeded.forEach(id => {
                            const card = document.querySelector(`.album-photo-card[data-id="${id}"]`);
                            if (card) card.remove();
                            AlbumState.photos = AlbumState.photos.filter(p => p.id !== id);
                        });

                        AlbumState.selectedPhotos = new Set(receipt.failed);
                        TimehutResults.invalidateAlbumCache();
                        const emptySourceUrl = receipt.succeeded.length ? syncMomentSourceUrl() : null;
                        renderPhotos(); updateSelectionUI();
                        if (!receipt.failed.length) cancelSelection();
                        alert(`確認刪除 ${receipt.succeeded.length} 張；未完成 ${receipt.failed.length} 張，選取已保留`);
                        if (!receipt.failed.length) leaveEmptyMoment(emptySourceUrl);
                    } else {
                        alert(`刪除失敗: ${result.error || result.message}`);
                    }
                } catch (error) {
                    console.error('Delete error:', error);
                    alert(`刪除失敗: ${error.message}`);
                }

                deleteBtn.disabled = false;
                deleteBtn.innerHTML = '🗑️ 刪除選取';
            }
        }

        // 批量移動到其他同日照片（改變拍攝日期）
        // Note: moveCollectionState is declared in timeline.js

        async function batchMoveToCollection() {
            const count = AlbumState.selectedPhotos.size;
            if (count === 0) return alert('請先選擇照片');

            // 顯示 Modal
            document.getElementById('moveCollectionCount').textContent = count;
            document.getElementById('collectionSelectionPrompt').textContent = '請先選擇目的同日照片。';
            document.getElementById('moveCollectionModal').classList.remove('hidden');
            document.getElementById('collectionListLoading').style.display = 'block';
            document.getElementById('collectionList').style.display = 'none';
            document.getElementById('moveCollectionConfirmBtn').disabled = true;
            moveCollectionState.targetDate = null;

            try {
                // 獲取當前孩子的所有照片並分組
                const sourceAlbum = new URLSearchParams(location.search).get('album');
                const storedIndex = parseInt((window.TimehutStorage?.local || localStorage).getItem('timehut_current_child') || '0');
                const child = sourceAlbum !== null
                    ? CONFIG.CHILDREN.find(child => String(child.albumId) === sourceAlbum)
                    : CONFIG.CHILDREN.find(child => String(child.albumId) === AlbumState.momentId) || CONFIG.CHILDREN[storedIndex];

                if (!child || !child.albumId) {
                    throw new Error('無法獲取當前相簿');
                }

                // 獲取相簿中所有照片
                const data = await FlickrAPI.getAlbumPhotos(child.albumId, 1, 500);
                const allPhotos = data.photos || [];

                // 按日期分組
                const collections = groupPhotosByDate(allPhotos);
                moveCollectionState.collections = collections;

                // 渲染列表
                renderCollectionList(collections);

            } catch (error) {
                console.error('Failed to load collections:', error);
                document.getElementById('collectionListLoading').innerHTML =
                    '<div style="color: var(--color-danger);">載入失敗: ' + error.message + '</div>';
            }
        }

        function groupPhotosByDate(photos) {
            const groups = new Map();

            photos.forEach(photo => {
                // 使用 datetaken 或 dateupload
                const dateKey = photoCalendarDay(photo);

                if (!groups.has(dateKey)) {
                    groups.set(dateKey, {
                        date: dateKey,
                        photos: [],
                        label: formatDateLabel(dateKey)
                    });
                }
                groups.get(dateKey).photos.push(photo);
            });

            // 轉換為數組並排序（新的在前）
            return Array.from(groups.values()).sort((a, b) => b.date.localeCompare(a.date));
        }

        function formatDateLabel(dateStr) {
            if (dateStr === 'unknown') return '未知日期';
            try {
                const d = new Date(dateStr + 'T12:00:00');
                const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
                return `${months[d.getMonth()]} ${d.getDate()}日`;
            } catch {
                return dateStr;
            }
        }

        function renderCollectionList(collections) {
            const listEl = document.getElementById('collectionList');
            const currentDate = (window.TimehutStorage?.session || sessionStorage).getItem('albumDate');

            // 過濾掉當前同日照片（可選）
            const filteredCollections = collections;

            if (filteredCollections.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--color-text-muted);">無可用的同日照片</div>';
            } else {
                listEl.innerHTML = filteredCollections.map((col, idx) => `
                    <button type="button" class="collection-item" aria-pressed="false" data-date="${col.date}" data-label="${col.label}" onclick="selectCollection(this)">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <img src="${FlickrAPI.getPhotoUrl(col.photos[0], 'm')}" 
                                 style="width: 50px; height: 50px; border-radius: 8px; object-fit: cover;">
                            <div class="collection-text">
                                <strong class="collection-title">${col.label}</strong>
                                <span class="collection-detail">${col.date} · ${col.photos.length} 張</span>
                            </div>
                        </div>
                        <div class="collection-check" style="display: none;">✓</div>
                    </button>
                `).join('');
            }

            document.getElementById('collectionListLoading').style.display = 'none';
            listEl.style.display = 'block';
        }

        function selectCollection(element) {
            // 移除其他選取
            document.querySelectorAll('.collection-item').forEach(el => {
                el.classList.remove('selected');
                el.setAttribute('aria-pressed','false');
                el.querySelector('.collection-check').style.display = 'none';
            });

            // 選取當前
            element.classList.add('selected');
            element.setAttribute('aria-pressed','true');
            element.querySelector('.collection-check').style.display = 'block';

            moveCollectionState.targetDate = element.dataset.date;
            moveCollectionState.targetLabel = element.dataset.label;
            document.getElementById('collectionSelectionPrompt').textContent = `已選擇：${element.dataset.label}。`;
            document.getElementById('moveCollectionConfirmBtn').disabled = false;
        }

        function closeMoveCollectionModal() {
            document.getElementById('moveCollectionModal').classList.add('hidden');
            moveCollectionState.targetDate = null;
        }

        async function confirmMoveCollection() {
            if (!moveCollectionState.targetDate) return;

            const count = AlbumState.selectedPhotos.size;
            const targetLabel = moveCollectionState.targetLabel;
            const targetDate = moveCollectionState.targetDate + ' 12:00:00';

            // The picker already names the selected date and consequences; its explicit action is the confirmation.

            const photoIds = Array.from(AlbumState.selectedPhotos);
            const btn = document.getElementById('moveCollectionConfirmBtn');
            btn.disabled = true;
            btn.textContent = '處理中...';

            try {
                const response = await (window.TimehutAPI?.fetch.bind(window.TimehutAPI) || fetch)(`${CONFIG.UPLOAD_API_URL}/api/photos/update-date`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ photoIds, targetDate })
                });

                const result = await response.json();

                if (response.ok) {
                    const { succeeded, failed } = TimehutResults.confirmed(result, photoIds);
                    const done = new Set(succeeded);
                    AlbumState.photos.forEach(photo => { if (done.has(String(photo.id))) photo.datetaken = targetDate; });
                    succeeded.forEach(id => AlbumState.selectedPhotos.delete(String(id)));
                    const originalDate = new URLSearchParams(location.search).get('date');
                    if (AlbumState.momentId?.startsWith('moment_') && originalDate) {
                        AlbumState.photos = AlbumState.photos.filter(photo => photoCalendarDay(photo) === originalDate);
                    }
                    TimehutResults.invalidateAlbumCache();
                    const emptySourceUrl = succeeded.length ? syncMomentSourceUrl() : null;
                    renderPhotos(); updateSelectionUI();
                    document.getElementById('moveCollectionCount').textContent = failed.length;
                    if (failed.length) {
                        if (succeeded.length) refreshMoveCollectionDateCounts(succeeded, targetDate);
                        alert(`已更新 ${succeeded.length}/${photoIds.length} 張的日期；${failed.length} 張未完成，僅保留未完成項目供重試`);
                        return;
                    }
                    alert(result.message || '移動成功');
                    closeMoveCollectionModal();
                    cancelSelection();
                    leaveEmptyMoment(emptySourceUrl);
                } else {
                    alert('移動失敗: ' + (result.error || result.message));
                }
            } catch (error) {
                alert('移動失敗: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '修改日期並合併';
            }
        }

        function showConfirmModal(title, message, confirmText = '確認') {
    return TimehutDialogs.confirm(message,{title,confirmText,danger:/刪除|移除/.test(title+confirmText),dialogId:'confirmModal',okId:'confirmOkBtn',cancelId:'confirmCancelBtn'}).then(value=>value===true);
}

        function replaceLoadedPhotos(photos) {
            const currentId=AlbumState.currentModalPhotoId;
            AlbumState.photos=photos;
            if(currentId!==null){const index=photos.findIndex(photo=>String(photo.id)===currentId);if(index<0){closeModal();return;}AlbumState.currentModalIndex=index;const indicator=document.getElementById('modalPageIndicator');if(indicator)indicator.textContent=`${index+1} / ${photos.length}`;}
        }

        async function openModal(index) {
            if (AlbumState.isSelectMode) return;

            AlbumState.currentModalIndex = index;
            const photo = AlbumState.photos[index];
            if (!photo) return;

            AlbumState.currentModalPhotoId=String(photo.id);
            const isVideo = photo.media === 'video';

            // For videos: open directly on Flickr in new window
            // For photos: show in modal as before
            const modal = document.getElementById('photoModal');
            const imgEl = document.getElementById('modalImage');
            const videoEl = document.getElementById('modalVideo');
            const iframeEl = document.getElementById('modalIframe');

            const previewUrl = isVideo
                ? (FlickrAPI.getPhotoUrl(photo, 'o') || FlickrAPI.getPhotoUrl(photo, 'l') || FlickrAPI.getPhotoUrl(photo, 'm'))
                : (FlickrAPI.getPhotoUrl(photo, 'l') || FlickrAPI.getPhotoUrl(photo, 'm'));

            // Reset all media elements
            imgEl.style.display = 'none';
            videoEl.style.display = 'none';
            videoEl.pause();
            videoEl.src = '';
            iframeEl.style.display = 'none';
            iframeEl.src = '';

            // Show image
            // The shared renderer owns pixels and async image identity.
            imgEl.style.display = 'block';

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            window.TimehutViewerMedia?.show(photo,{photos:AlbumState.photos,index});
            window.TimehutViewerOverview?.set({photos:AlbumState.photos,index,select:id=>{
                const target=AlbumState.photos.findIndex(item=>String(item.id)===id);
                if(target>=0)openModal(target);
            }});

            document.getElementById('modalTitle').textContent = photo.title || '未命名';
            document.getElementById('modalDate').textContent = formatDate(photoCalendarDay(photo));
            const ageLabel = document.getElementById('modalAge');
            ageLabel.textContent = '';
            const childIndex = CONFIG.CHILDREN.findIndex(child => String(child.albumId) === new URLSearchParams(location.search).get('album'));
            const child = CONFIG.CHILDREN[childIndex];
            if (child) {
                const birthday = (window.TimehutStorage?.local || localStorage).getItem(`timehut_child_${childIndex}_birthdate`) || child.birthDate;
                const age = calculateAge(birthday, photoCalendarDay(photo));
                if (Number.isFinite(age.totalDays)) ageLabel.textContent = age.totalDays < 0 ? '☺ 紀念日前' : '☺ ' + formatAgeString(age.years, age.months, age.days);
            }
            ageLabel.hidden = !ageLabel.textContent;

            const pageIndicator = document.getElementById('modalPageIndicator');
            if (pageIndicator) {
                pageIndicator.textContent = `${index + 1} / ${AlbumState.photos.length}`;
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            if (dateStr === 'unknown') return '未知日期';
            const date = new Date(dateStr + 'T12:00:00');
            if (isNaN(date.getTime())) return dateStr;
            const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            return `${date.getFullYear()}年${months[date.getMonth()]}${date.getDate()}日`;
        }

        async function downloadCurrentPhoto() {
            const photo=AlbumState.currentModalPhotoId===null?AlbumState.photos[AlbumState.currentModalIndex]:AlbumState.photos.find(photo=>String(photo.id)===AlbumState.currentModalPhotoId);
            if(!photo)return;
            try { if (await window.TimehutTransfers?.download(photo)) return; }
            catch (error) { showToast(error.message || '原生下載未開始', 'error'); return; }
            const btn = document.getElementById('modalDownloadBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ 下載中...';
            btn.disabled = true;

            try {
                const url = await TimehutTransfers.mediaUrl(photo);
                const response = await (window.TimehutAPI?.fetch.bind(window.TimehutAPI) || fetch)(url);
                if (!response.ok) throw new Error('下載失敗');
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = photo.media === 'video' ? `${photo.id}.${blob.type.split(';')[0].trim().toLowerCase() === 'video/quicktime' ? 'mov' : 'mp4'}` : `${photo.id}-${new URL(url).pathname.split('/').at(-1) || 'photo.jpg'}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(blobUrl);

                btn.innerHTML = '✅ 已交給瀏覽器下載';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 1500);
            } catch (error) {
                console.error('Download error:', error);
                if (photo.media === 'video') {
                    showToast('影片原檔下載失敗，請稍後按下載重試', 'error');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    return;
                }
                // Fallback
                window.open(FlickrAPI.getPhotoUrl(photo, 'b'), '_blank');
                btn.innerHTML = '⚠️ 已開新分頁';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 1500);
            }
        }

        function closeModal() {
            window.TimehutViewerOverview?.clear();
            AlbumState.currentModalPhotoId=null;
            window.TimehutViewerMedia?.stop();
            const videoEl = document.getElementById('modalVideo');
            if (videoEl) videoEl.pause();

            document.getElementById('photoModal')?.classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigatePhoto(direction) {
            const newIndex = AlbumState.currentModalIndex + direction;
            if (newIndex >= 0 && newIndex < AlbumState.photos.length) {
                openModal(newIndex);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (document.querySelector('.timehut-dialog')) return;
            if (e.key !== 'Escape' && e.target instanceof Element && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
            const modal = document.getElementById('photoModal');
            if (!modal?.classList.contains('active')) return;

            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') navigatePhoto(-1);
            if (e.key === 'ArrowRight') navigatePhoto(1);
        });

        // Fix: Click background to close photo modal
        (window.TimehutPage?.onReady || (fn => document.addEventListener('DOMContentLoaded',fn)))( () => {
            const modal = document.getElementById('photoModal');
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal || 
                        e.target.classList.contains('modal-overlay') || 
                        e.target.classList.contains('modal-content')) {
                        closeModal();
                    }
                });
            }
        });
    </script>
</body>
