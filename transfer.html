<!doctype html>
<html lang="zh-TW"><head><link rel="icon" href="favicon.png" type="image/png">
    <style>html[data-timehut-loading] body{visibility:hidden}</style>
    <script src="js/accounts.js?v=20261016.5"></script>
    <script src="js/web-upload.js?v=20261016.1"></script>
    <script src="js/account-config.js?v=20261016.5"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>傳輸中心 · 時光相簿</title><link rel="stylesheet" href="css/style.css?v=20261014.2"><link rel="stylesheet" href="css/storybook.css?v=20261016.5"><script defer src="js/transfers.js?v=20261016.5"></script><script defer src="js/pwa.js?v=20261016.1"></script>
<script defer src="js/deletion-status.js?v=20261017.1"></script></head>
<body class="storybook-page transfer-page"><main class="settings-container">
<div class="settings-header"><a class="btn-secondary" href="timeline.html">← 返回時間軸</a><h1>傳輸中心</h1></div>
<section class="settings-section transfer-intro"><img class="dialog-art" src="assets/storybook-family.png" alt=""><p id="transferCapability" role="status">正在確認手機能力…</p><p class="storybook-note">上傳以 Flickr 完成為準；下載後須再保存至相簿。手動強制結束 App 可能中止或延後傳輸，請回來確認。</p>
<div class="transfer-setup"><label>上傳至相簿<select id="transferAlbum" class="upload-select"></select></label><details class="transfer-default-tags"><summary>標籤、網路與通知設定</summary><label>預設標籤（選填，以空格分開）<input id="transferTags" class="upload-input" placeholder="生日 家人"></label><div class="transfer-notification-settings"><label class="transfer-notification-option"><input id="wifiOnly" type="checkbox" disabled><span id="wifiOnlyLabel">僅 Wi-Fi 傳輸</span></label><p id="networkStatus" class="storybook-note" role="status">正在確認網路設定…</p></div><div class="transfer-notification-settings"><label class="transfer-notification-option"><input id="completionNotifications" type="checkbox" disabled>傳輸完成時通知我</label><p id="notificationStatus" class="storybook-note" role="status">正在確認通知設定…</p></div></details></div>
<div class="storybook-install"><button id="nativePickButton" class="btn-tag" hidden>選擇照片／影片</button><button id="refreshTransfers" class="btn-secondary">更新狀態</button></div></section>
<p id="transferSummary" class="transfer-summary" role="status"></p><nav class="transfer-filters" aria-label="篩選傳輸任務"><button class="btn-secondary" data-transfer-filter="all" aria-pressed="true">全部</button><button class="btn-secondary" data-transfer-filter="upload" aria-pressed="false">上傳</button><button class="btn-secondary" data-transfer-filter="download" aria-pressed="false">下載</button><button class="btn-secondary" data-transfer-filter="completed" aria-pressed="false">已完成</button></nav>
<section id="transferList" aria-live="polite"></section><div class="install-actions"><a href="install.html" class="btn-secondary">安裝到手機</a></div></main></body></html>
