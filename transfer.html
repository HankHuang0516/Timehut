<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>傳輸中心 · 時光相簿</title><link rel="stylesheet" href="css/style.css?v=20261014.2"><link rel="stylesheet" href="css/storybook.css?v=20261028.native-album-settings.1"><script defer src="js/transfer-queue-actions.js?v=20261101.1"></script><link rel="stylesheet" href="css/device-photo-picker.css?v=20261101.1"><script defer src="js/device-photo-picker.js?v=20261101.1"></script><script defer src="js/transfers.js?v=20261101.queue.1"></script><script defer src="js/pwa.js?v=20261016.1"></script>

<body class="storybook-page transfer-page transfer-minimal app-ui"><main class="settings-container" data-public-page-shell>
<header class="settings-header"><a class="transfer-back" href="timeline.html">‹ 返回時間軸</a><h1>傳輸中心</h1><p class="transfer-subtitle">管理照片與影片的上傳、下載</p></header>
<section class="settings-section transfer-intro" data-account-private><p id="transferCapability" role="status">正在確認手機能力…</p>
<div class="transfer-setup"><label>上傳至相簿<select id="transferAlbum" class="upload-select"></select></label><details class="transfer-default-tags" id="transfer-preferences"><summary>標籤、網路與通知設定</summary><label class="transfer-notification-option"><input type="checkbox" id="skipUploaded" checked>略過已上傳的相同照片與標籤</label><p class="storybook-note">僅核對此帳戶、此相簿的完成紀錄；取消勾選可重新上傳。</p><p><a href="settings.html#deviceSettingsTitle">App 設定與權限</a></p><label>預設標籤（選填，以空格分開）<input id="transferTags" class="upload-input" placeholder="生日 家人"></label><div class="transfer-notification-settings"><label class="transfer-notification-option"><input id="wifiOnly" type="checkbox" disabled><span id="wifiOnlyLabel">僅 Wi-Fi 傳輸</span></label><p id="networkStatus" class="storybook-note" role="status">正在確認網路設定…</p></div><div class="device-notification-control"><h3>裝置通知</h3><p id="deviceProgressNotificationStatus" role="status">正在讀取裝置通知…</p><button type="button" class="btn-secondary" id="enableDeviceNotifications" hidden>啟用裝置通知</button> <button type="button" class="btn-secondary" id="openDeviceNotificationSettings" hidden>開啟手機通知設定</button></div><div class="transfer-notification-settings"><label class="transfer-notification-option"><input id="completionNotifications" type="checkbox" disabled>傳輸完成時通知我</label><p id="notificationStatus" class="storybook-note" role="status">正在確認通知設定…</p></div><p class="storybook-note">上傳顯示「已完成」才代表照片保存成功；下載後可再保存至手機相簿。手動強制結束 App 可能中止或延後傳輸，請回來確認。</p></details></div>
<div class="storybook-install"><button id="nativePickButton" class="btn-tag" hidden>選擇照片／影片</button><button id="refreshTransfers" class="btn-secondary">更新狀態</button></div></section>
<div class="queue-section-heading"><h2>傳輸佇列</h2></div><div id="queueBatchActions" class="queue-batch-actions" hidden><button id="retryQueue" type="button" disabled>整批重試</button><button id="removeQueue" type="button" disabled>移除佇列</button></div><p id="queueActionStatus" class="queue-action-status" role="status" aria-live="polite"></p><p id="transferSummary" class="transfer-summary" role="status"></p><nav class="transfer-filters" aria-label="篩選傳輸任務"><button class="btn-secondary" data-transfer-filter="all" aria-pressed="true">全部</button><button class="btn-secondary" data-transfer-filter="attention" aria-pressed="false">需處理</button><button class="btn-secondary" data-transfer-filter="upload" aria-pressed="false">上傳</button><button class="btn-secondary" data-transfer-filter="download" aria-pressed="false">下載</button><button class="btn-secondary" data-transfer-filter="completed" aria-pressed="false">已完成</button><button class="btn-secondary" data-transfer-filter="removed" aria-pressed="false">已移除</button></nav>
<section data-account-private id="transferList" aria-live="polite"></section><div class="install-actions"><a href="install.html" class="btn-secondary">App 使用說明</a></div></main></body></html>
